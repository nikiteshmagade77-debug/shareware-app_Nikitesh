name: Post API CI

on:
  push:
    branches:
      - main
    paths:
      - 'post/**'
      - '.github/workflows/post-api-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'post/**'
      - '.github/workflows/post-api-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: post/package-lock.json

      - name: Install dependencies
        working-directory: post
        run: npm ci

      - name: Run unit tests
        working-directory: post
        run: npm test

      - name: Log in to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Post API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./post
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/post-api:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/post-api:latest
